<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SnapScore — Boost Your Snapchat Score</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --snap-yellow: #FFFC00;
            --snap-black: #1A1A2E;
            --snap-white: #FFFFFF;
            --snap-glow: rgba(255, 252, 0, 0.25);
            --bg-start: #0B0B1A;
            --bg-end: #1A1A2E;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.35);
            --radius: 28px;
            --radius-sm: 14px;
            --shadow: 0 40px 80px rgba(0, 0, 0, 0.7);
            --transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(160deg, var(--bg-start), var(--bg-end), #0F1B3D);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--snap-yellow);
            border-radius: 50%;
            opacity: 0.15;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: var(--radius);
            padding: 36px 30px;
            max-width: 460px;
            width: 100%;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 252, 0, 0.05), transparent 60%);
            pointer-events: none;
            animation: rotateGlow 40s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            width: 84px;
            height: 84px;
            background: var(--snap-yellow);
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 16px 48px var(--snap-glow);
            position: relative;
            transition: var(--transition);
        }

        .logo-icon:hover {
            transform: scale(1.05) rotate(-4deg);
            box-shadow: 0 20px 60px rgba(255, 252, 0, 0.35);
        }

        .logo-icon .pulse-ring {
            position: absolute;
            inset: -6px;
            border-radius: 30px;
            border: 2px solid rgba(255, 252, 0, 0.15);
            animation: pulseRing 2.5s ease-in-out infinite;
        }

        @keyframes pulseRing {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0; }
        }

        .logo-icon svg {
            width: 46px;
            height: 46px;
            fill: #1A1A2E;
            position: relative;
            z-index: 2;
        }

        .logo h1 {
            color: var(--text-primary);
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .logo h1 span {
            color: var(--snap-yellow);
            -webkit-text-fill-color: var(--snap-yellow);
        }

        .logo .subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .trust-badges {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .trust-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .trust-badge .icon {
            font-size: 14px;
        }

        .trust-badge .highlight {
            color: var(--snap-yellow);
        }

        .step {
            display: none;
            animation: fadeSlide 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            z-index: 1;
        }

        .step.active {
            display: block;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .step-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: var(--transition);
        }

        .step-dot.active {
            background: var(--snap-yellow);
            box-shadow: 0 0 20px var(--snap-glow);
            width: 28px;
            border-radius: 12px;
        }

        .step-dot.done {
            background: rgba(255, 252, 0, 0.4);
        }

        .info-box {
            background: rgba(255, 252, 0, 0.04);
            border: 1px solid rgba(255, 252, 0, 0.08);
            border-radius: var(--radius-sm);
            padding: 18px 20px;
            margin-bottom: 24px;
            color: var(--text-secondary);
            font-size: 13.5px;
            line-height: 1.8;
            transition: var(--transition);
        }

        .info-box strong {
            color: var(--snap-yellow);
            font-weight: 700;
        }

        .info-box .highlight {
            color: var(--text-primary);
            font-weight: 600;
        }

        .info-box .emoji-big {
            font-size: 20px;
            margin-right: 4px;
        }

        .feature-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 14px 0 22px 0;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: var(--transition);
        }

        .feature-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 252, 0, 0.06);
            transform: translateY(-2px);
        }

        .feature-item .emoji {
            font-size: 26px;
            display: block;
            margin-bottom: 4px;
        }

        .feature-item .text {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .feature-item .sub-text {
            color: var(--text-muted);
            font-size: 9px;
            margin-top: 2px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            border: 2px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--snap-yellow);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 40px rgba(255, 252, 0, 0.06);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--snap-yellow), #F5A623);
            color: #1A1A2E;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.3px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
            opacity: 0;
            transition: var(--transition);
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 48px rgba(255, 252, 0, 0.25);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(255, 255, 255, 0.05);
        }

        .status {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            display: none;
            font-weight: 500;
            animation: fadeSlide 0.4s ease;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background: rgba(255, 252, 0, 0.08);
            color: var(--snap-yellow);
            border: 1px solid rgba(255, 252, 0, 0.12);
        }

        .status.success {
            background: rgba(0, 255, 100, 0.08);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 100, 0.12);
        }

        .status.error {
            background: rgba(255, 50, 50, 0.08);
            color: #ff6b6b;
            border: 1px solid rgba(255, 50, 50, 0.12);
        }

        .status.info {
            background: rgba(50, 150, 255, 0.08);
            color: #4fc3ff;
            border: 1px solid rgba(50, 150, 255, 0.12);
        }

        .status .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.15);
            border-top: 2.5px solid var(--snap-yellow);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .code-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .code-group input {
            flex: 1;
        }

        .code-group .btn-sm {
            padding: 16px 20px;
            border: none;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            font-family: inherit;
        }

        .code-group .btn-sm:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            padding: 20px;
            margin: 18px 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
        }

        .timer-box .label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .timer-box .value {
            color: var(--snap-yellow);
            font-size: 32px;
            font-weight: 900;
            margin-top: 6px;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        .timer-box .sub {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 6px;
        }

        .success-icon {
            font-size: 72px;
            display: block;
            margin-bottom: 12px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .success-title {
            color: var(--text-primary);
            font-size: 26px;
            font-weight: 900;
        }

        .success-sub {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 8px;
            line-height: 1.7;
        }

        .success-highlight {
            color: var(--snap-yellow);
            font-weight: 700;
        }

        .user-list {
            margin: 18px 0;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .user-list .title {
            color: var(--text-muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 600;
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: var(--transition);
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-item:hover {
            padding-left: 4px;
        }

        .user-item .name {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .user-item .name .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulseDot 1.5s ease-in-out infinite;
        }

        .user-item .name .status-dot.online {
            background: #00ff88;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .user-item .score {
            color: var(--snap-yellow);
            font-size: 13px;
            font-weight: 700;
        }

        .user-item .badge {
            background: rgba(255, 252, 0, 0.08);
            color: var(--snap-yellow);
            font-size: 9px;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 8px;
            font-weight: 600;
        }

        .user-list .more {
            text-align: center;
            color: var(--text-muted);
            font-size: 10px;
            margin-top: 8px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .warning-box {
            background: rgba(255, 50, 50, 0.04);
            border: 1px solid rgba(255, 50, 50, 0.08);
            border-radius: 12px;
            padding: 14px 18px;
            margin: 14px 0;
            color: var(--text-muted);
            font-size: 11.5px;
            line-height: 1.7;
            text-align: center;
        }

        .warning-box strong {
            color: #ff6b6b;
            font-weight: 700;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--text-secondary);
        }

        .footer .divider {
            color: var(--text-muted);
            opacity: 0.3;
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(0, 255, 100, 0.04);
            border: 1px solid rgba(0, 255, 100, 0.08);
            border-radius: 20px;
            padding: 6px 16px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            margin-top: 16px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .security-badge .lock {
            font-size: 12px;
        }

        .boost-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0 20px 0;
        }

        .boost-option {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 12px 6px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.04);
            transition: var(--transition);
            cursor: default;
        }

        .boost-option:hover {
            border-color: rgba(255, 252, 0, 0.15);
            background: rgba(255, 255, 255, 0.04);
        }

        .boost-option .number {
            color: var(--snap-yellow);
            font-size: 18px;
            font-weight: 900;
            display: block;
            -webkit-text-fill-color: var(--snap-yellow);
        }

        .boost-option .label {
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 600;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        .boost-option.popular {
            border-color: rgba(255, 252, 0, 0.2);
            background: rgba(255, 252, 0, 0.04);
            position: relative;
        }
